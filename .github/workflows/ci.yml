name: CI

on:
  pull_request:
  push:
    branches: [main]

# Sem permissões por omissão: cada job pede só o que precisa.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` respeita o package-lock.json e falha se estiver dessincronizado,
      # ao contrário de `npm install`.
      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY }}

  regras:
    name: Regras do Firestore
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # O emulador do Firestore corre em Java. A partir da versão 15 a CLI do
      # Firebase exige JDK 21 ou superior.
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Exercita o firestore.rules do repositório: quem cria, quem lê,
      # o que é rejeitado. Falha o PR se alguma proteção cair.
      - name: Testar regras
        run: npm run test:regras

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Bloqueante: o que vai dentro do bundle que o convidado descarrega.
      # Aqui a exigência é total — qualquer vulnerabilidade reprova o PR.
      - name: Dependências de produção
        run: npm audit --omit=dev --audit-level=low

      # Informativo: as ferramentas de desenvolvimento (sobretudo a CLI do
      # Firebase) arrastam dezenas de pacotes transitivos que ficam atrás nas
      # correções. Não chegam ao browser, por isso não travam o PR — mas ficam
      # visíveis no registo para não passarem despercebidas.
      - name: Ferramentas de desenvolvimento (informativo)
        run: npm audit || true

  secrets:
    name: Procurar segredos no código
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Corre-se a imagem oficial diretamente, em vez da action: a action
      # analisa apenas o intervalo do push (`base^..head`) e rebenta quando o
      # intervalo inclui o commit raiz, que não tem pai. Assim varre-se o
      # histórico todo, que é o que interessa — um segredo commitado e depois
      # removido continua lá.
      - name: gitleaks
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 \
            --report-format json --report-path /repo/gitleaks.json
          codigo=$?
          set -e
          if [ "$codigo" -ne 0 ] && [ -s gitleaks.json ]; then
            echo "--- achados: regra, ficheiro, linha e commit (o valor nunca é impresso) ---"
            jq -r '.[] | "\(.RuleID)  \(.File):\(.StartLine)  commit=\(.Commit[0:8])"' gitleaks.json
          fi
          exit $codigo
